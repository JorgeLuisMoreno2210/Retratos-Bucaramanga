<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="icon" href="icons/icon_shopping_cart_notification.svg">
</head>
<body>
    <div class="container">
        <h1>Registro de Clientes</h1>
        <form id="orderForm">
            <div class="logoretrato">
                <a href="index.html"><img src="img/retratosnegro.png" alt=""></a>
            </div>
            <div class="form-group">
                <label for="name">Nombres</label>
                <input type="text" name="name" id="name" placeholder="Ingrese sus nombres" required>
            </div>
            <div class="form-group">
                <label for="last-name">Apellidos</label>
                <input type="text" name="last-name" id="last-name" placeholder="Ingrese sus apellidos" required>
            </div>
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" placeholder="Ingrese un correo electronico" required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="Ingrese su numero de telefono" required >
            </div>
            <div class="form-group">
                <label for="address">Direccion</label>
                <input type="text" id="address" name="address" placeholder="Ingrese su direccion" required>
            </div>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
        <div id="confirmationMessage" class="confirmation-message"></div>
    </div>
    <script src="js/formulario-cliente.js"></script>
</body>
</html>
