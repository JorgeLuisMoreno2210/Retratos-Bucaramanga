<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Venta</title>
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="icon" href="icons/icon_shopping_cart_notification.svg">
</head>
<body>
    <div class="container">
        <h1>Registro de Venta</h1>
        <form id="salesForm">
            <div class="logoretrato">
                <a href="index.html"><img src="img/retratosnegro.png" alt=""></a>
            </div>
            <div class="form-group">
                <label for="clientName">Cliente</label>
                <input type="text" id="clientName" name="clientName" placeholder="Nombre del cliente" required>
            </div>
            <div class="form-group">
                <label for="product">Producto</label>
                <select name="product" id="product" required>
                    <option selected disabled>Seleccione un producto</option>
                    <option value="Retratos (10 fotos)">Retratos (10 fotos)</option>
                    <option value="Retratos (18 fotos)">Retratos (18 fotos)</option>
                    <option value="Imantadas (Photostrip)">Imantadas (Photostrip)</option>
                    <option value="Imantadas (Mini Polaroid)">Imantadas (Mini Polaroid)</option>
                    <option value="Imantadas (Polaroid)">Imantadas (Polaroid)</option>
                    <option value="Imantadas (Cuadrada)">Imantadas (Cuadrada)</option>
                    <option value="Retablo (14 x 14)">Retablo (14 x 14)</option>
                    <option value="Retablo (20 x 20)">Retablo (20 x 20)</option>
                    <option value="Retablo (20 x 30)">Retablo (20 x 30)</option>
                    <option value="Retablo (30 x 30)">Retablo (30 x 30)</option>
                    <option value="Retablo (30 x 45)">Retablo (30 x 45)</option>
                    <option value="Retablo (49 x 49)">Retablo (49 x 49)</option>
                    <option value="Acrílicos">Acrílicos</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Cantidad</label>
                <input type="number" name="quantity" id="quantity" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="value">Valor</label>
                <input type="text" id="value" name="value" disabled required>
            </div>
            <div class="form-group">
                <label for="paymentMethod">Medio de Pago</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="" disabled selected>Seleccione un método</option>
                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                    <option value="PayPal">PayPal</option>
                </select>
            </div>
            <div class="form-group" id="creditCardDetails" style="display: none;">
                <label for="cardType">Tipo de Tarjeta</label>
                <select id="cardType" name="cardType">
                    <option value="" disabled selected>Seleccione tipo de tarjeta</option>
                    <option value="Visa">Visa</option>
                    <option value="MasterCard">MasterCard</option>
                    <option value="American Express">American Express</option>
                </select>
            </div>
            <div class="form-group">
                <label for="saleDate">Fecha</label>
                <input type="date" id="saleDate" name="saleDate" required>
            </div>
            <button type="submit" class="btn-submit">Registrar Venta</button>
        </form>
        <div id="confirmationMessage" class="confirmation-message"></div>
    </div>
    <script src="js/formulario-venta.js"></script>
</body>
</html>
